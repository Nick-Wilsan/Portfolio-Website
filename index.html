<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nick Wilsan - PM Portfolio</title>
    <meta
      name="description"
      content="Product Manager who ships. Two products built for real businesses in Batam: a factory production system and a used-car showroom app on Google Play."
    />

    <!-- Link previews (WhatsApp, LinkedIn, Slack use Open Graph; X uses Twitter Card) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nickwilsan-portfolio.vercel.app/" />
    <meta property="og:title" content="Nick Wilsan - PM Portfolio" />
    <meta
      property="og:description"
      content="Product Manager who ships. Two products built for real businesses in Batam: a factory production system and a used-car showroom app on Google Play."
    />
    <meta property="og:image" content="https://nickwilsan-portfolio.vercel.app/work/hongfu-film-poster.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nick Wilsan - PM Portfolio" />
    <meta
      name="twitter:description"
      content="Product Manager who ships. Two products built for real businesses in Batam: a factory production system and a used-car showroom app on Google Play."
    />
    <meta name="twitter:image" content="https://nickwilsan-portfolio.vercel.app/work/hongfu-film-poster.jpg" />
    <script>
      // Apply theme before paint to avoid flash of incorrect theme.
      // Light by default; dark only once the visitor picks it with the toggle.
      (function () {
        try {
          if (localStorage.getItem("theme") === "dark") {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
